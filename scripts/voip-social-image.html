<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8" />
  <title>VoIP social image source</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #eaf5ef; color: #143f35; font-family: Arial, sans-serif; letter-spacing: 0; }
    main { position: relative; width: 100%; height: 100%; padding: 44px 58px; border-top: 12px solid #0369a1; }
    .logo { width: 285px; height: 63px; object-fit: contain; }
    .domain { position: absolute; right: 58px; top: 58px; color: #03658d; font-size: 22px; }
    h1 { font-size: 62px; line-height: 1.08; margin: 25px 0 14px; font-weight: 700; }
    p { margin: 0; font-size: 24px; color: #245f56; }
    .product { position: absolute; width: 775px; height: auto; left: 58px; bottom: 25px; }
    .service { position: absolute; right: 58px; bottom: 85px; width: 230px; padding-left: 23px; border-left: 3px solid #0369a1; font-size: 24px; line-height: 1.5; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="../public/assets/images/centralcomms.svg" alt="Central Communications Ltd" />
    <span class="domain">centralcomms.nz</span>
    <h1>Business VoIP<br />Hamilton &amp; Waikato</h1>
    <p>Yeastar PBX &amp; Linkus. Connected wherever you work.</p>
    <img class="product" src="../public/assets/images/voip/linkus.webp" alt="Linkus desktop and mobile clients" />
    <div class="service">Local installation.<br />Practical training.<br />Ongoing support.</div>
  </main>
</body>
</html>
