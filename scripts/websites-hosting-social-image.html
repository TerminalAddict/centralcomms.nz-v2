<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8" />
  <title>Websites and hosting social image source</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #28312d; color: #fff; font-family: Arial, sans-serif; letter-spacing: 0; }

    .brand { position: absolute; inset: 0 0 auto; height: 112px; padding: 24px 58px; background: #fff; border-top: 10px solid #0369a1; }
    .logo { width: 285px; height: 60px; object-fit: contain; }
    .domain { position: absolute; right: 58px; top: 40px; color: #03658d; font-size: 22px; }
    .location { margin: 138px 0 20px; color: #b3eddb; font-size: 24px; }
    h1 { font-size: 66px; line-height: 1.08; margin: 0 0 24px; font-weight: 700; }
    .service { max-width: 1000px; margin: 0; font-size: 26px; line-height: 1.4; }
    .footnote { position: absolute; bottom: 36px; margin: 0; font-size: 20px; color: #dbede7; }
  </style>
</head>
<body>
  <main>
    <img class="photo" src="../public/assets/images/websites-hosting/proxmox-hosting-platform.webp" alt="CCL Proxmox hosting platform" />
    <div class="brand"><img class="logo" src="../public/assets/images/centralcomms.svg" alt="Central Communications Ltd" /><span class="domain">centralcomms.nz</span></div>
    <p class="location">HAMILTON &amp; WAIKATO</p>
    <h1>Websites that work.<br />Hosted here in NZ.</h1>
    <p class="service">Web design. WordPress. NZ hosting.<br />Waikato servers. Western Bay of Plenty backups.</p>
    <p class="footnote">Local Hamilton support &middot; 24/7 emergency assistance</p>
  </main>
</body>
</html>
