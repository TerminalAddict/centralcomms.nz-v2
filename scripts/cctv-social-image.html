<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8" />
  <title>CCTV social image source</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #252e2a; color: #fff; font-family: Arial, sans-serif; letter-spacing: 0; }
    main { position: relative; isolation: isolate; width: 100%; height: 100%; padding: 44px 58px; }
    .photo { position: absolute; z-index: -2; inset: 112px 0 0; width: 100%; height: 518px; object-fit: cover; object-position: right top; }
    main::before { content: ''; position: absolute; z-index: -1; inset: 0; background: rgba(10, 25, 21, 0.74); }
    .brand { position: absolute; inset: 0 0 auto; height: 112px; padding: 24px 58px; background: #fff; border-top: 10px solid #0369a1; }
    .logo { width: 285px; height: 60px; object-fit: contain; }
    .domain { position: absolute; right: 58px; top: 40px; color: #03658d; font-size: 22px; }
    .location { margin: 138px 0 20px; color: #b3eddb; font-size: 24px; }
    h1 { font-size: 64px; line-height: 1.08; margin: 0 0 24px; font-weight: 700; }
    .service { max-width: 740px; margin: 0; font-size: 26px; line-height: 1.4; }
    .credential { position: absolute; bottom: 44px; margin: 0; font-size: 20px; color: #dbede7; }
  </style>
</head>
<body>
  <main>
    <img class="photo" src="../public/assets/images/cctv/cctv-installations-hero.webp" alt="Montage of Central Communications' work vehicle and a CCTV installation" />
    <div class="brand"><img class="logo" src="../public/assets/images/centralcomms.svg" alt="Central Communications Ltd" /><span class="domain">centralcomms.nz</span></div>
    <p class="location">HAMILTON &amp; WAIKATO</p>
    <h1>CCTV installers.<br />Clarity when it counts.</h1>
    <p class="service">Nx Witness. Practical camera systems.<br />Local installation and ongoing support.</p>
    <p class="credential">PSPLA licensed &middot; Businesses, schools and homes</p>
  </main>
</body>
</html>
